name: WxTyper
options:
  bundleIdPrefix: com.xuzhougeng
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  WxTyper:
    type: application
    platform: macOS
    sources:
      - path: Native/WxTyper
        excludes:
          - Resources
    resources:
      - path: Native/WxTyper/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuzhougeng.wxtyper
        PRODUCT_NAME: WxTyper
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Native/WxTyper/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - WxTyperTests
  WxTyperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Native/WxTyperTests
    dependencies:
      - target: WxTyper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuzhougeng.wxtyper.tests
        GENERATE_INFOPLIST_FILE: YES
